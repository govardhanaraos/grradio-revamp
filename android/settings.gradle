pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    def flutterSdkPath = null
    File localPropertiesFile = new File(settingsDir, "local.properties")
    if (localPropertiesFile.exists()) {
        Properties properties = new Properties()
        localPropertiesFile.withReader("UTF-8") { reader ->
            properties.load(reader)
        }
        flutterSdkPath = properties.getProperty("flutter.sdk")
    }

    assert flutterSdkPath != null : "flutter.sdk not set in local.properties"
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // FIXED: Updated to 8.9.1 to satisfy dependency requirements
    id "com.android.application" version "8.9.1" apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
    id "com.google.gms.google-services" version "4.3.15" apply false
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://jitpack.io" }
        // Required for io.flutter:flutter_embedding_* artifacts
        maven { url "https://storage.googleapis.com/download.flutter.io" }
    }
}

include(":app")

// Namespace auto-fix for older plugins
gradle.beforeProject { project ->
    project.afterEvaluate {
        if (project.plugins.hasPlugin("com.android.library")) {
            def androidExt = project.extensions.findByName("android")
            if (androidExt != null && androidExt.hasProperty("namespace") && androidExt.namespace == null) {
                androidExt.namespace = "${project.group}.${project.name}"
            }
        }
    }
}